name: Obsidian checks and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

jobs:
  check:
    if: github.ref_type != 'tag'
    uses: PriyanshuMallick/obsidian_extentions_template/.github/workflows/obsidian.yml@main
  release:
    if: github.ref_type == 'tag'
    uses: PriyanshuMallick/obsidian_extentions_template/.github/workflows/obsidian.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
